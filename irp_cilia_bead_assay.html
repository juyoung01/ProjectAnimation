<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRP Cilia — Fluorescent Bead Flow Assay</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e1a;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh;color:#e2e8f0}
  h1{font-size:17px;font-weight:600;color:#e2e8f0;margin-bottom:2px}
  .sub{font-size:12px;color:#94a3b8;margin-bottom:10px;text-align:center;max-width:700px;line-height:1.5}
  .stage{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:4px;box-shadow:0 0 30px rgba(59,130,246,.08)}
  .cr{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
  .cr button{padding:7px 16px;font-size:13px;font-weight:500;border:1.5px solid #334155;border-radius:8px;cursor:pointer;background:#1e293b;color:#e2e8f0;transition:all .15s}
  .cr button:hover{background:#334155}
  .cr button:disabled{opacity:.3;cursor:default}
  .pill{font-size:11px;padding:3px 10px;border-radius:6px;background:#1e293b;color:#94a3b8;font-weight:500}
  .pill.uv{background:#2e1065;color:#c084fc}.pill.bl{background:#1e3a5f;color:#60a5fa}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:4px;font-size:11px;color:#94a3b8}
</style>
</head>
<body>

<h1>IRP Cilia on Surface — Fluorescent Bead Flow Assay</h1>
<p class="sub">IRP fiber cilia가 표면에 고정 → UV light → cilia 휨 → 유체 흐름 → 형광 bead 이동 확인</p>

<div class="stage"><canvas id="cv" width="900" height="550"></canvas></div>

<div class="cr">
  <button id="btn-uv" onclick="startUV()">☀️ UV — Activate Cilia</button>
  <button id="btn-bl" onclick="startBlue()" disabled>🔵 Blue — Relax</button>
  <button onclick="resetAll()">↺ Reset</button>
  <span id="pill" class="pill">Ready</span>
</div>

<div class="legend">
  <span><svg width="14" height="14"><line x1="7" y1="14" x2="7" y2="2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/></svg> IRP Cilium</span>
  <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#22c55e" opacity=".9"/></svg> Fluorescent Bead</span>
  <span><svg width="14" height="14"><rect width="14" height="4" y="5" fill="#78716c"/></svg> Surface</span>
  <span><svg width="14" height="14"><path d="M2 7 Q7 3 12 7" fill="none" stroke="#60a5fa" stroke-width="1.5"/></svg> Fluid Flow</span>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ── Layout ──
const SURFACE_Y = 420;
const NUM_CILIA = 12;
const CILIA_SPACING = 65;
const CILIA_START_X = 55;
const CILIUM_LEN = 120;    // total length of each cilium
const CILIUM_SEGS = 12;    // segments for smooth curve
const CILIUM_THICK = 2.5;

// Beads
const NUM_BEADS = 18;
const BEAD_R_MIN = 3, BEAD_R_MAX = 6;

let state = 'closed';
let bendProgress = 0;
let beads = [];
let time = 0;
let cilia = [];

// Each cilium gets slight random variation
function initCilia() {
  cilia = [];
  for (let i = 0; i < NUM_CILIA; i++) {
    cilia.push({
      x: CILIA_START_X + i * CILIA_SPACING,
      len: CILIUM_LEN + (Math.random() - 0.5) * 30,
      phase: Math.random() * 0.3,
      color: `hsl(${0 + Math.random()*15}, ${70+Math.random()*15}%, ${55+Math.random()*10}%)`
    });
  }
}
initCilia();

function initBeads() {
  beads = [];
  for (let i = 0; i < NUM_BEADS; i++) {
    const sx = Math.random() * (W - 60) + 30;
    const sy = SURFACE_Y - 40 - Math.random() * 280;
    beads.push({
      x: sx, y: sy,
      startX: sx, startY: sy,
      r: BEAD_R_MIN + Math.random() * (BEAD_R_MAX - BEAD_R_MIN),
      vx: 0, vy: 0,
      brightness: 0.7 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2,
      maxDrift: 150 + Math.random() * 250  // each bead drifts 150~400px then stops
    });
  }
}
initBeads();

// ── Drawing ──
function drawBackground() {
  ctx.fillStyle = '#0a1628';
  ctx.fillRect(0, 0, W, H);

  const grd = ctx.createLinearGradient(0, 0, 0, SURFACE_Y);
  grd.addColorStop(0, 'rgba(30,58,138,0.08)');
  grd.addColorStop(1, 'rgba(30,58,138,0.2)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, SURFACE_Y);

  // Surface
  const sgrd = ctx.createLinearGradient(0, SURFACE_Y, 0, H);
  sgrd.addColorStop(0, '#57534e');
  sgrd.addColorStop(0.3, '#44403c');
  sgrd.addColorStop(1, '#292524');
  ctx.fillStyle = sgrd;
  ctx.fillRect(0, SURFACE_Y, W, H - SURFACE_Y);

  ctx.strokeStyle = '#78716c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, SURFACE_Y);
  ctx.lineTo(W, SURFACE_Y);
  ctx.stroke();

  ctx.fillStyle = 'rgba(168,162,158,0.15)';
  for (let x = 10; x < W; x += 20) {
    for (let y = SURFACE_Y + 8; y < H; y += 15) {
      ctx.fillRect(x + (y%2)*10, y, 2, 2);
    }
  }

  ctx.fillStyle = '#a8a29e';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Glass Surface', W/2, SURFACE_Y + 50);
}

function drawUVlight() {
  if (state === 'opening' || state === 'open') {
    ctx.save();
    for (let i = 0; i < 30; i++) {
      const x = 10 + i * 30;
      const alpha = 0.12 + 0.06 * Math.sin(time * 3 + i);
      ctx.strokeStyle = `rgba(168,85,247,${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 3, 35);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(168,85,247,0.6)';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('UV (365 nm)', 10, 15);
    ctx.restore();
  }
  if (state === 'closing') {
    ctx.save();
    for (let i = 0; i < 30; i++) {
      const x = 10 + i * 30;
      const alpha = 0.1 + 0.05 * Math.sin(time * 3 + i);
      ctx.strokeStyle = `rgba(59,130,246,${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 3, 35);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(59,130,246,0.6)';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('Blue (450 nm)', 10, 15);
    ctx.restore();
  }
}

function drawCilium(c, bend) {
  // Simple curved line from base, bending to the right
  const maxAngle = bend * 70 * Math.PI / 180; // max bend angle at tip
  const segLen = c.len / CILIUM_SEGS;
  // Gentle idle sway
  const sway = Math.sin(time * 1.5 + c.phase * 10) * 3 * (1 - bend * 0.8);

  ctx.save();
  ctx.beginPath();

  let px = c.x, py = SURFACE_Y;
  ctx.moveTo(px, py);

  for (let s = 1; s <= CILIUM_SEGS; s++) {
    const t = s / CILIUM_SEGS;
    // Angle increases along length (more bend at tip)
    const angle = -Math.PI/2 + maxAngle * t * t + sway * t * Math.PI / 180;
    px += segLen * Math.cos(angle);
    py += segLen * Math.sin(angle);
    ctx.lineTo(px, py);
  }

  ctx.strokeStyle = c.color;
  ctx.lineWidth = CILIUM_THICK;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Small anchor dot at base
  ctx.fillStyle = '#a8a29e';
  ctx.beginPath();
  ctx.arc(c.x, SURFACE_Y, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFlowArrows(bend) {
  if (bend < 0.15) return;
  const alpha = Math.min(0.5, bend * 0.5);
  ctx.save();
  ctx.strokeStyle = `rgba(96,165,250,${alpha})`;
  ctx.fillStyle = `rgba(96,165,250,${alpha})`;
  ctx.lineWidth = 1.2;

  const flowY_levels = [SURFACE_Y - 50, SURFACE_Y - 110, SURFACE_Y - 170, SURFACE_Y - 230];
  const flowSpeed = time * 25; // slower flow arrows

  for (const fy of flowY_levels) {
    for (let i = 0; i < 4; i++) {
      const fx = ((i * 220 + flowSpeed) % (W + 100)) - 50;
      const wavY = fy + Math.sin(fx * 0.015 + time) * 6;

      ctx.beginPath();
      ctx.moveTo(fx, wavY);
      ctx.lineTo(fx + 25, wavY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(fx + 25, wavY);
      ctx.lineTo(fx + 20, wavY - 3);
      ctx.lineTo(fx + 20, wavY + 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.font = '11px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText('Fluid Flow →', W - 15, SURFACE_Y - 270);
  ctx.restore();
}

function drawBeads() {
  for (const b of beads) {
    ctx.save();
    const grd = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3);
    const pulse = 0.5 + 0.3 * Math.sin(time * 4 + b.phase);
    grd.addColorStop(0, `rgba(74,222,128,${0.8 * b.brightness})`);
    grd.addColorStop(0.4, `rgba(34,197,94,${0.4 * pulse})`);
    grd.addColorStop(1, 'rgba(34,197,94,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(74,222,128,${b.brightness})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${0.5 * b.brightness})`;
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function updateBeads(dt) {
  const flowForce = bendProgress * 0.4;

  for (const b of beads) {
    // How far has this bead drifted since last UV activation?
    const dx = b.x - b.startX;
    const drifted = Math.abs(dx);

    // Once it reaches maxDrift for this cycle, stop flow force
    const reachedLimit = drifted >= b.maxDrift;

    // Very subtle Brownian motion (always present)
    b.vx += (Math.random() - 0.5) * 0.04;
    b.vy += (Math.random() - 0.5) * 0.03;

    if (!reachedLimit && (state === 'opening' || state === 'open')) {
      // Flow force only during UV activation
      const proximity = Math.max(0, 1 - (SURFACE_Y - b.y) / 300);
      const ease = Math.max(0, 1 - drifted / b.maxDrift);
      b.vx += flowForce * (0.2 + proximity * 0.5) * ease;
    }

    // Strong damping
    b.vx *= 0.97;
    b.vy *= 0.97;

    b.x += b.vx;
    b.y += b.vy;

    // Bounds
    if (b.y > SURFACE_Y - b.r - 5) { b.y = SURFACE_Y - b.r - 5; b.vy *= -0.3; }
    if (b.y < 30 + b.r) { b.y = 30 + b.r; b.vy *= -0.3; }

    // Bead exits right → respawn from left
    if (b.x > W + 15) {
      b.x = -10;
      b.y = SURFACE_Y - 40 - Math.random() * 280;
      b.startX = b.x;
      b.vx = 0; b.vy = 0;
      b.maxDrift = 150 + Math.random() * 250;
    }
  }

  // Continuously spawn new beads from left edge
  if (beads.length < 30 && Math.random() < 0.03) {
    const sy = SURFACE_Y - 40 - Math.random() * 280;
    beads.push({
      x: -5, y: sy,
      startX: -5, startY: sy,
      r: BEAD_R_MIN + Math.random() * (BEAD_R_MAX - BEAD_R_MIN),
      vx: 0, vy: 0,
      brightness: 0.7 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2,
      maxDrift: 150 + Math.random() * 250
    });
  }
}

function drawInfo() {
  ctx.fillStyle = '#64748b';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'left';
  if (state === 'closed') {
    ctx.fillText('Cilia at rest — beads in Brownian motion', 15, H - 15);
  } else if (state === 'opening' || state === 'open') {
    ctx.fillText('UV activates cilia → bending → directional fluid flow → beads drift →', 15, H - 15);
  } else if (state === 'closing') {
    ctx.fillText('Blue light → cilia straighten → flow stops', 15, H - 15);
  }
}

function drawMicroscopeFrame() {
  ctx.strokeStyle = 'rgba(148,163,184,0.2)';
  ctx.lineWidth = 2;
  const m = 8, c = 25;
  ctx.beginPath(); ctx.moveTo(m, m+c); ctx.lineTo(m, m); ctx.lineTo(m+c, m); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-m-c, m); ctx.lineTo(W-m, m); ctx.lineTo(W-m, m+c); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(m, H-m-c); ctx.lineTo(m, H-m); ctx.lineTo(m+c, H-m); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-m-c, H-m); ctx.lineTo(W-m, H-m); ctx.lineTo(W-m, H-m-c); ctx.stroke();

  ctx.fillStyle = 'rgba(148,163,184,0.5)';
  ctx.fillRect(W - 120, H - 30, 60, 3);
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('10 μm', W - 90, H - 35);
}

// ── Animation Loop ──
let lastTime = 0;
function frame(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  time += dt;

  if (state === 'opening') {
    bendProgress = Math.min(1, bendProgress + dt * 1.5);
    if (bendProgress >= 1) state = 'open';
  } else if (state === 'closing') {
    bendProgress = Math.max(0, bendProgress - dt * 1.5);
    if (bendProgress <= 0) { state = 'closed'; document.getElementById('btn-uv').disabled = false; }
  }

  updateBeads(dt);

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawUVlight();
  drawFlowArrows(bendProgress);

  for (const c of cilia) {
    drawCilium(c, bendProgress);
  }

  drawBeads();
  drawMicroscopeFrame();
  drawInfo();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// ── Controls ──
function startUV() {
  state = 'opening';
  // Reset each bead's start position so it drifts again this cycle
  for (const b of beads) {
    b.startX = b.x;
    b.startY = b.y;
    b.maxDrift = 150 + Math.random() * 250;
  }
  document.getElementById('btn-uv').disabled = true;
  document.getElementById('btn-bl').disabled = false;
  document.getElementById('pill').className = 'pill uv';
  document.getElementById('pill').textContent = 'UV — Cilia bending';
}

function startBlue() {
  state = 'closing';
  document.getElementById('btn-bl').disabled = true;
  document.getElementById('pill').className = 'pill bl';
  document.getElementById('pill').textContent = 'Blue — Relaxing';
}

function resetAll() {
  state = 'closed';
  bendProgress = 0;
  initBeads();
  document.getElementById('btn-uv').disabled = false;
  document.getElementById('btn-bl').disabled = true;
  document.getElementById('pill').className = 'pill';
  document.getElementById('pill').textContent = 'Ready';
}
</script>
</body>
</html>
